version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: guidesoft_fullstack_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: guidesoft-it
    volumes:
      - mongo_data:/data/db

  mailhog:
    image: mailhog/mailhog:latest
    container_name: guidesoft_fullstack_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mongo_data:
