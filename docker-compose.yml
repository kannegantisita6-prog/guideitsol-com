version: '3.8'

services:
  # MongoDB for guidesoft-it-solutions-fullstack
  mongodb:
    image: mongo:7.0
    container_name: guideitsol_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: guidesoft-it
    volumes:
      - mongo_data:/data/db

  # PostgreSQL for Prisma / Drizzle ORM
  postgres:
    image: postgres:16-alpine
    container_name: guideitsol_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: guidesoft_user
      POSTGRES_PASSWORD: guidesoft_secure_password_2026
      POSTGRES_DB: guidesoft_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis for Session, Caching & Realtime Queues
  redis:
    image: redis:7-alpine
    container_name: guideitsol_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # MailHog - Mock SMTP Server & Webmail UI for testing email forms locally
  mailhog:
    image: mailhog/mailhog:latest
    container_name: guideitsol_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI

volumes:
  mongo_data:
  postgres_data:
  redis_data:
